<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detection Coverage Board &mdash; ATT&amp;CK Enterprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Brand palette
     #0A183F navy (background)  #5D8E9D slate  #A7B5B9 mist
     #5CD2CC turquoise          #BF6B04 amber
     Surfaces and text are tints and shades of those five;
     --alarm is the one addition, needed to separate Critical from amber. */
  --brand:#0A183F;
  --ink:#0A183F; --deep:#060F2B; --surface:#152346; --raised:#1E2E56;
  --line:#2C3C66; --line-soft:#1F2D51;
  --paper:#DCE4E6; --muted:#A7B5B9; --faint:#6E8A98;
  --live:#1DBD8E; --live-bright:#00D4C6; --partial:#EEB72B; --alarm:#F24F4F;
  --beam:#3C93FA; --beam-deep:#006ECF; --high:#FF8F5C; --info:#9151B8;
  --col:248px; --gut:11px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
body{
  background:var(--ink); color:var(--paper);
  font-family:'Archivo',ui-sans-serif,system-ui,'Segoe UI',sans-serif;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  height:100vh; display:flex; flex-direction:column; overflow:hidden;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,'Cascadia Code',Menlo,monospace}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none !important}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--beam);outline-offset:2px}

/* ---------- masthead ---------- */
header{
  border-bottom:1px solid var(--line); background:var(--deep);
  padding:14px 20px 0; flex:none;
}
.top{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap}
h1{font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
h1::before{content:'';display:block;width:26px;height:2px;background:var(--beam);margin-bottom:9px}
h1 span{display:block;font-size:13.5px;font-weight:400;color:var(--faint);letter-spacing:.02em;margin-top:3px}

.gauge{display:flex;align-items:flex-end;gap:22px;margin-left:auto}
.stat{text-align:right;min-width:56px}
.stat b{display:block;font-size:24px;font-weight:600;line-height:1;font-family:'IBM Plex Mono',monospace}
.stat i{font-style:normal;font-size:12.5px;color:var(--faint);letter-spacing:.03em}
.stat.live b{color:var(--live-bright)} .stat.part b{color:var(--partial)} .stat.gap b{color:var(--faint)}

.controls{display:flex;align-items:center;gap:8px;padding:12px 0 11px;flex-wrap:wrap}
.cust{display:flex;align-items:center;gap:7px}
.cust label{font-size:13px;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.cust select{
  background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--beam);
  border-radius:3px;padding:6px 9px;font-size:14.5px;max-width:210px;
}
.link{display:flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--line);border-radius:3px;font-size:14px;color:var(--muted)}
.link .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.link.on .dot{background:var(--live-bright)}
.link.ro .dot{background:var(--partial)}
.link button{font-size:13.5px;color:var(--beam)}
.link button:hover{text-decoration:underline}
.link.loaded{
  background:rgba(0,212,198,.15); border-color:var(--live-bright); color:var(--paper);
  box-shadow:0 0 0 1px rgba(0,212,198,.30);
}
.link.loaded .dot{background:var(--live-bright)}
.link.loaded button{color:var(--live-bright)}
.link.loaded .fname{font-weight:600;color:var(--live-bright)}
.link .fname{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes pillIn{
  0%{background:rgba(0,212,198,.45);box-shadow:0 0 0 4px rgba(0,212,198,0)}
  100%{background:rgba(0,212,198,.15);box-shadow:0 0 0 1px rgba(0,212,198,.30)}
}
.link.flash{animation:pillIn .9s ease-out 2}
@media(prefers-reduced-motion:reduce){.link.flash{animation:none}}
.conflict .crow{cursor:default}
.mnote{padding:14px 18px;font-size:14.5px;color:var(--muted);line-height:1.5}
.mbtns{display:flex;gap:8px;padding:0 18px 16px;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:250px;max-width:440px}
.search input{
  width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:3px;padding:8px 12px 8px 34px;font-size:15px;
}
.search input::placeholder{color:var(--faint)}
.search svg{position:absolute;left:10px;top:10px;width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:2}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{padding:7px 14px;font-size:14.5px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--paper)}
.act{padding:7px 13px;font-size:14.5px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
.act:hover{border-color:var(--beam);color:var(--paper)}
.act.key{border-color:var(--live);color:var(--live)}

/* ---------- board ---------- */
.board{flex:1;overflow:auto;padding:0 20px 40px;scrollbar-width:thin}
.board::-webkit-scrollbar{height:11px;width:11px}
.board::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.grid{display:flex;gap:var(--gut);align-items:flex-start;min-width:min-content;padding-top:14px}
.tcol{width:var(--col);flex:none}
.chead{position:sticky;top:0;z-index:6;background:var(--ink);padding-bottom:7px}
.chead h2{font-size:15px;font-weight:600;letter-spacing:-.005em;line-height:1.25}
.chead .tid{font-size:12.5px;color:var(--faint);letter-spacing:.04em}
.meter{height:3px;background:var(--line-soft);border-radius:2px;margin-top:7px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .f{background:var(--live-bright)} .meter .p{background:var(--partial)}
.cmeta{font-size:12.5px;color:var(--faint);margin-top:5px;display:flex;justify-content:space-between}

.tile{
  background:var(--surface);border:1px solid var(--line-soft);border-left:3px solid var(--line);
  border-radius:2px;margin-bottom:4px;position:relative;
}
.tile.covered{border-left-color:var(--live-bright)}
.tile.partial{border-left-color:var(--partial)}
.tile > .row{display:flex;align-items:flex-start;gap:7px;padding:8px 9px 9px;width:100%;text-align:left}
.tile .row:hover{background:var(--raised)}
.tile .body{flex:1;min-width:0}
.tile .tn{font-size:13.5px;line-height:1.35;word-wrap:break-word}
.tile .tc{font-size:11.5px;color:var(--faint);letter-spacing:.03em;display:block;margin-bottom:1px}
.count{
  font-size:12px;font-weight:600;padding:1px 5px;border-radius:2px;flex:none;margin-top:1px;
  background:rgba(0,212,198,.18);color:var(--live-bright);font-family:'IBM Plex Mono',monospace;
}
.count.nolink{background:rgba(238,183,43,.18);color:var(--partial)}
.caret{
  flex:none;min-width:26px;padding-left:2px;padding-right:2px;font-size:11.5px;color:var(--faint);text-align:center;
  padding:1px 0;border:1px solid var(--line);border-radius:2px;margin-top:1px;
  font-family:'IBM Plex Mono',monospace;
}
.caret:hover{border-color:var(--beam);color:var(--beam)}
.subs{display:none;border-top:1px solid var(--line-soft);background:var(--deep)}
.tile.open .subs{display:block}
.sub{display:flex;align-items:flex-start;gap:7px;width:100%;text-align:left;padding:7px 9px 7px 17px;border-bottom:1px solid var(--line-soft)}
.sub:last-child{border-bottom:none}
.sub:hover{background:var(--raised)}
.sub .tn{font-size:13px;color:#C3CFD3}
.sub.covered{box-shadow:inset 3px 0 0 var(--live-bright)}
.sub.partial{box-shadow:inset 3px 0 0 var(--partial)}
.empty{padding:30px 4px;color:var(--faint);font-size:13.5px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,9,26,.70);opacity:0;pointer-events:none;transition:opacity .16s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;height:100vh;width:min(660px,100vw);background:var(--deep);
  border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s cubic-bezier(.3,.7,.3,1);
  z-index:21;display:flex;flex-direction:column;
}
.drawer.on{transform:none}
@media(prefers-reduced-motion:reduce){.drawer{transition:none}.scrim{transition:none}}
.dhead{padding:18px 20px 15px;border-bottom:1px solid var(--line)}
.dhead .tid{font-size:13px;color:var(--beam);letter-spacing:.05em}
.dhead h3{font-size:19px;font-weight:600;line-height:1.25;margin:4px 0 8px}
.dhead .ctx{font-size:13.5px;color:var(--faint)}
.dhead .ctx a{color:var(--muted)}
.close{position:absolute;top:14px;right:16px;font-size:22px;color:var(--faint);line-height:1;padding:4px 8px}
.close:hover{color:var(--paper)}
.dbody{flex:1;overflow-y:auto;padding:16px 20px 24px}

.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:4px;padding:13px 14px;margin-bottom:9px}
.card .nm{font-size:15.5px;font-weight:500;line-height:1.3}
.card .cid{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--beam);letter-spacing:.04em}
.chips{display:flex;gap:5px;align-items:center;margin-top:7px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:3px 9px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.chip.s-Critical{border-color:var(--alarm);color:var(--alarm);background:rgba(242,79,79,.12)}
.chip.s-High{border-color:var(--high);color:var(--high);background:rgba(255,143,92,.12)}
.chip.s-Medium{border-color:var(--partial);color:var(--partial)}
.chip.s-Low{border-color:var(--beam);color:var(--beam)}
.chip.s-Informational{border-color:var(--info);color:#B58BD4}
.chip.st-Enabled{border-color:var(--live-bright);color:var(--live-bright);background:rgba(0,212,198,.12)}
.chip.st-Tuning{border-color:var(--partial);color:var(--partial)}
.chip[class*="st-In"]{border-color:var(--beam);color:var(--beam)}
.card .lnk{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--live-bright);margin-top:8px;text-decoration:none}
.card .lnk:hover{text-decoration:underline}
.card .nolnk{font-size:13.5px;color:var(--partial);margin-top:8px}
.card .note{font-size:13.5px;color:var(--muted);margin-top:6px;white-space:pre-wrap}
.wl{margin-top:9px}
.wl .wlab{font-size:12px;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:5px}
.wlset{display:flex;flex-wrap:wrap;gap:5px}
.wchip{
  display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  font-size:12.5px;padding:3px 8px;border-radius:2px;border:1px solid var(--line);
  background:var(--ink);color:#BFD8DC;max-width:100%;
}
.wchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wchip button{font-size:15px;line-height:1;color:var(--faint);padding:0;flex:none}
.wchip button:hover{color:var(--alarm)}
.wnone{font-size:13.5px;color:var(--faint);font-style:italic}
.wladd{display:flex;gap:6px;margin-top:7px}
.wladd input{
  flex:1;background:var(--ink);border:1px solid var(--line);border-radius:2px;padding:6px 8px;
  font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:13.5px;
}
.wladd button{
  padding:6px 12px;font-size:14px;border:1px solid var(--line);border-radius:2px;color:var(--beam);flex:none;
}
.wladd button:hover{border-color:var(--beam)}
.qtoggle{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--beam);margin-top:8px;padding:0}
.qtoggle:hover{text-decoration:underline}
.qtoggle .tri{font-size:10px;transition:transform .14s;display:inline-block}
.qtoggle[aria-expanded="true"] .tri{transform:rotate(90deg)}
@media(prefers-reduced-motion:reduce){.qtoggle .tri{transition:none}}
.qwrap{display:none;margin-top:8px;border:1px solid var(--line);border-radius:2px;background:var(--deep);overflow:hidden}
.qwrap.on{display:block}
.qbar{display:flex;align-items:center;gap:10px;padding:5px 9px;border-bottom:1px solid var(--line-soft);background:var(--ink)}
.qbar .meta{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--faint);letter-spacing:.04em}
.qbar .sp{margin-left:auto;display:flex;gap:10px}
.qbar button{font-size:12.5px;color:var(--faint)}
.qbar button:hover{color:var(--beam)}
pre.kql{
  margin:0;padding:12px 13px;max-height:400px;overflow:auto;
  font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  font-size:13px;line-height:1.62;white-space:pre;tab-size:2;color:#C9D6DA;
}
pre.kql::-webkit-scrollbar{width:9px;height:9px}
pre.kql::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
pre.kql .c{color:var(--faint);font-style:italic}
pre.kql .s{color:#73CC80}
pre.kql .k{color:#3C93FA}
pre.kql .n{color:#EEB72B}
pre.kql .p{color:#9CB6C2;font-weight:600}
.field textarea.code{
  font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:13px;
  line-height:1.6;min-height:150px;white-space:pre;overflow-wrap:normal;overflow-x:auto;
}
.qmissing{font-size:13.5px;color:var(--faint);margin-top:8px;font-style:italic}
.cardacts{display:flex;gap:12px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line-soft)}
.cardacts button{font-size:13.5px;color:var(--faint)}
.cardacts button:hover{color:var(--beam)}
.cardacts button.del:hover{color:var(--alarm)}

form.add{border:1px dashed var(--line);border-radius:3px;padding:13px;margin-top:4px}
form.add h4{font-size:14.5px;font-weight:600;margin-bottom:10px;color:var(--muted)}
.field{margin-bottom:9px}
.field label{display:block;font-size:13px;color:var(--faint);margin-bottom:3px}
.field input,.field select,.field textarea{
  width:100%;background:var(--ink);border:1px solid var(--line);border-radius:2px;
  padding:6px 8px;font-size:14.5px;
}
.field textarea{resize:vertical;min-height:48px}
.pair{display:flex;gap:8px}.pair>*{flex:1}
.submit{background:var(--live-bright);color:#04202A;font-weight:600;padding:7px 15px;border-radius:2px;font-size:14.5px}
.submit:hover{filter:brightness(1.08)}
.ghost{padding:7px 13px;font-size:14.5px;color:var(--muted);border:1px solid var(--line);border-radius:2px}
.none{font-size:14.5px;color:var(--faint);padding:14px 0 4px}

.modal{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-48%);width:min(500px,94vw);
  background:var(--deep);border:1px solid var(--line);border-radius:4px;z-index:31;
  opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;
}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
@media(prefers-reduced-motion:reduce){.modal{transition:none}}
.modal h3{font-size:17px;font-weight:600;padding:16px 18px 13px;border-bottom:1px solid var(--line)}
.mlist{max-height:46vh;overflow-y:auto;padding:8px 0}
.crow{padding:9px 18px;border-bottom:1px solid var(--line-soft)}
.crow:last-child{border-bottom:none}
.crow:hover{background:var(--surface)}
.crow .line{display:flex;align-items:baseline;gap:10px}
.crow .nm{flex:1;font-size:15.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .nm b{font-weight:500}
.crow .tally{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--faint);flex:none}
.crow.cur{box-shadow:inset 2px 0 0 var(--beam)}
.crow .acts{display:flex;gap:14px;margin-top:5px}
.crow button{font-size:13px;color:var(--faint);flex:none;padding:0}
.crow button:hover{color:var(--beam)}
.crow button.del:hover{color:var(--alarm)}
.mfoot{display:flex;gap:8px;align-items:flex-end;padding:13px 18px 16px;border-top:1px solid var(--line)}
.mfoot .field{flex:1;margin:0}
.scrim2{position:fixed;inset:0;background:rgba(4,9,26,.72);opacity:0;pointer-events:none;transition:opacity .15s;z-index:30}
.scrim2.on{opacity:1;pointer-events:auto}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);
  background:var(--raised);border:1px solid var(--line);border-left:2px solid var(--live);
  padding:9px 16px;border-radius:3px;font-size:14.5px;z-index:40;opacity:0;transition:all .18s;
}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:640px){
  header{padding:12px 14px 0}.board{padding:0 14px 30px}
  .gauge{margin-left:0;width:100%;justify-content:space-between;gap:10px}
  h1{font-size:19px}
}
</style>
</head>
<body>

<header>
  <div class="top">
    <h1>Detection Coverage Board<span>MITRE ATT&amp;CK Enterprise v19.2 &nbsp;&middot;&nbsp; 15 tactics &nbsp;&middot;&nbsp; <span id="techTotal" style="display:inline"></span> techniques</span></h1>
    <div class="gauge">
      <div class="stat live"><b id="gLive">0</b><i>documented</i></div>
      <div class="stat part"><b id="gPart">0</b><i>no query link</i></div>
      <div class="stat gap"><b id="gGap">0</b><i>uncovered</i></div>
      <div class="stat"><b id="gPct">0%</b><i>of matrix</i></div>
    </div>
  </div>
  <div class="controls">
    <div class="cust">
      <label for="custSel">View</label>
      <select id="custSel" title="Switch customer view"></select>
      <button class="act" id="custMgr" title="Add, rename, duplicate or remove customers">Manage</button>
    </div>
    <div class="link" id="linkBox">
      <span class="dot" id="linkDot"></span>
      <span id="linkTxt">Local only</span>
      <button id="saveNowBtn" title="Write the board straight back to the connected board.json">Save to shared file</button>
      <button id="linkBtn" title="Connect this board to the shared board.json in your synced SharePoint folder">Connect file</button>
      <button id="pullBtn" title="Reload from the shared file" hidden>Reload</button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Search technique or analytic" autocomplete="off">
    </div>
    <div class="seg" role="group" aria-label="Filter view">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="covered" aria-pressed="false">Covered</button>
      <button data-f="nolink" aria-pressed="false">Missing link</button>
      <button data-f="gap" aria-pressed="false">Gaps</button>
    </div>
    <button class="act" id="expandAll">Expand sub-techniques</button>
    <button class="act" id="exp" title="Download the whole board as board.json">Save</button>
    <button class="act" id="imp">Import file</button>
    <button class="act" id="csv">Export CSV</button>
    <button class="act" id="kqlout">Export .kql</button>
    <button class="act" id="wipe">Clear all</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </div>
</header>

<main class="board"><div class="grid" id="grid"></div></main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dhead">
    <button class="close" id="close" aria-label="Close panel">&times;</button>
    <div class="tid mono" id="dTid"></div>
    <h3 id="dName"></h3>
    <div class="ctx" id="dCtx"></div>
  </div>
  <div class="dbody" id="dBody"></div>
</aside>
<div class="scrim2" id="scrim2"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <h3 id="modalTitle">Customer views</h3>
  <div class="mlist" id="mList"></div>
  <form class="mfoot" id="addCust">
    <div class="field"><label>New customer</label><input name="name" placeholder="Customer name" required></div>
    <button type="submit" class="submit">Add</button>
    <button type="button" class="ghost" id="modalClose">Done</button>
  </form>
</div>

ed > ago(lookback)\n| where ResultType in (failure_codes)\n| where isnotempty(IPAddress)\n| summarize\n    FailedAttempts       = count(),\n    DistinctUsersTargeted= dcount(UserPrincipalName),\n    TargetedUsers        = make_set(UserPrincipalName, 50),\n    AppsTargeted         = make_set(AppDisplayName, 20),\n    ClientApps           = make_set(ClientAppUsed, 10),\n    Countries            = make_set(tostring(LocationDetails.countryOrRegion), 10),\n    FirstSeen            = min(TimeGenerated),\n    LastSeen             = max(TimeGenerated)\n    by IPAddress\n| where DistinctUsersTargeted >= distinct_user_threshold\n// Legacy auth protocols are a strong spray signal - raise severity if present\n| extend LegacyAuthUsed = ClientApps has_any (\"IMAP4\", \"POP3\", \"SMTP\", \"Other clients\", \"Exchange ActiveSync\")\n| extend Severity = iff(LegacyAuthUsed, \"High\", \"Medium\")\n| order by DistinctUsersTargeted desc\n// TUNING: exclude your own VPN egress and any legitimate scanner / pen-test IPs.\n//         Bump distinct_user_threshold if your tenant is large."}],"T1069.003":[{"id":"CA-002","name":"Enumeration of Entra ID directory objects by a non-admin","url":"","status":"Draft","sev":"Low","note":"","kql":"let lookback = 6h;\nlet graph_recon_ops = dynamic([\n    \"Get-AzureADUser\", \"List users\", \"List groups\", \"List servicePrincipals\",\n    \"List directoryRoles\", \"List applications\"]);\nAuditLogs\n| where TimeGenerated > ago(lookback)\n| where Category in (\"UserManagement\", \"GroupManagement\", \"DirectoryManagement\", \"ApplicationManagement\")\n| where OperationName has_any (graph_recon_ops) or OperationName startswith \"List \"\n| extend Actor       = tostring(InitiatedBy.user.userPrincipalName)\n| extend SourceIP    = tostring(InitiatedBy.user.ipAddress)\n| extend AppUsed     = tostring(AdditionalDetails[0].value)\n| where isnotempty(Actor)\n| summarize\n    OperationCount = count(),\n    Operations     = make_set(OperationName, 25),\n    Sourc el,\n          Encoded, Downloader, Severity, SHA256, ReportId, DeviceId\n| order by TimeGenerated desc\n// TUNING: some finance and reporting macros legitimately call cmd.exe. Exclude by\n//         InitiatingProcessCommandLine referencing a known internal template path."},{"id":"CA-021","name":"Executable dropped into a user-writable directory and then run","url":"","status":"Draft","sev":"Medium","note":"","kql":"let lookback = 2h;\nlet write_paths = dynamic([\n    @\"\\appdata\\local\\temp\\\", @\"\\appdata\\roaming\\\", @\"\\users\\public\\\",\n    @\"\\programdata\\\", @\"\\windows\\temp\\\", @\"\\downloads\\\", @\"\\perflogs\\\",\n    @\"\\windows\\tasks\\\", @\"\\$recycle.bin\\\"]);\nlet drops =\n    DeviceFileEvents\n    | where TimeGenerated > ago(lookback)\n    | where ActionType in (\"FileCreated\", \"FileRenamed\", \"FileModified\")\n    | where FileName endswith \".exe\" or FileName endswith \".dll\" or FileName endswith \".scr\"\n    | where FolderPath has_any (write_paths)\n    | where isnotempty(SHA256)\n    | project DropTime = TimeGenerated, DeviceId, DeviceName, SHA256,\n              DroppedFile = FileName, DropPath = FolderPath,\n              DroppedBy = InitiatingProcessFileName,\n              DroppedByCmd = InitiatingProcessCommandLine,\n              DropAccount = InitiatingProcessAccountName;\nDeviceProcessEvents\n| where TimeGenerated > ago(lookback)\n| where isnotempty(SHA256)\n| join kind=inner drops on DeviceId, SHA256\n| where TimeGenerated >= DropTime\n| extend SecondsToExecution = datetime_diff('second', TimeGenerated, DropTime)\n| project TimeGenerated, DeviceName, DeviceId, AccountName,\n          ExecutedFile = FileName, FolderPath, ProcessCommandLine,\n          DroppedFile, DropPath, DroppedBy, DroppedByCmd, DropAccount,\n          DropTime, SecondsToExecution, SHA256, ReportId\n| order by SecondsToExecution asc\n// TUNING: software installers do exactly this. Exclude DroppedBy in\n//         (\"msiexec.exe\",\"ccmexec.exe\",\ "url":"","status":"Draft","sev":"High","note":"","kql":"let lookback = 1h;\nOfficeActivity\n| where TimeGenerated > ago(lookback)\n| where OfficeWorkload =~ \"Exchange\"\n| where Operation in~ (\"Add-MailboxPermission\", \"Add-RecipientPermission\",\n                       \"Add-MailboxFolderPermission\", \"New-ManagementRoleAssignment\",\n                       \"Set-MailboxFolderPermission\", \"AddFolderPermissions\")\n| extend Params = tostring(Parameters)\n| where Params has_any (\"FullAccess\", \"SendAs\", \"SendOnBehalf\", \"Owner\",\n                        \"ApplicationImpersonation\", \"Editor\")\n| extend TargetMailbox = extract(@\"(?i)\"\"Name\"\"\\s*:\\s*\"\"Identity\"\"\\s*,\\s*\"\"Value\"\"\\s*:\\s*\"\"([^\"\"]+)\"\"\", 1, Params)\n| extend GrantedTo     = extract(@\"(?i)\"\"Name\"\"\\s*:\\s*\"\"User\"\"\\s*,\\s*\"\"Value\"\"\\s*:\\s*\"\"([^\"\"]+)\"\"\", 1, Params)\n| extend HighRisk      = Params has_any (\"ApplicationImpersonation\", \"FullAccess\", \"SendAs\")\n| project TimeGenerated, UserId, ClientIP, Operation, TargetMailbox, GrantedTo,\n          HighRisk, ResultStatus, Params\n| order by TimeGenerated desc\n// TUNING: shared mailbox onboarding fires this. Exclude by UserId for the\n//         helpdesk automation account and correlate with a ticket reference."}],"T1071.001":[{"id":"CA-038","name":"Beaconing - regular-interval outbound connections","url":"","status":"Draft","sev":"High","note":"","kql":"let lookback = 24h;\nlet min_connections = 30;\nlet max_jitter_ratio = 0.15;\nDeviceNetworkEvents\n| where TimeGenerated > ago(lookback)\n| where ActionType == \"ConnectionSuccess\"\n| where isnotempty(RemoteIP)\n| where not(ipv4_is_private(RemoteIP))\n| where RemotePort in (80, 443, 8080, 8443, 53, 22, 4444, 8000)\n| where not(RemoteUrl has_any (\n    \"microsoft.com\", \"windowsupdate.com\", \"msftconnecttest.com\", \"office.com\",\n    \"office365.com\", \"azureedge.net\", \"akamai\", \"google.com\", \"gstatic.com\",\n    \"cloudflare.com\", \"digicert.com\", \"msedge.net\", \"live.com\", \"sharepoint.com\"))\n| sort by DeviceId asc, RemoteIP asc, TimeGenerated asc\n| extend PrevTime = prev(TimeGenerated), PrevDevice = prev(DeviceId), PrevRemote = prev(RemoteIP)\n| where DeviceId == PrevDevice and RemoteIP == PrevRemote\n| extend DeltaSeconds = datetime_diff('second', TimeGenerated, PrevTime)\n| where DeltaSeconds between (5 .. 7200)\n| summarize\n    ConnectionCount = count(),\n    AvgInterval     = avg(DeltaSeconds),\n    StdDevInterval  = stdev(DeltaSeconds),\n    MinInterval     = min(DeltaSeconds),\n    MaxInterval     = max(DeltaSeconds),\n    Ports           = make_set(RemotePort, 10),\n    Urls            = make_set(RemoteUrl, 10),\n    FirstSeen       = min(TimeGenerated),\n    LastSeen        = max(TimeGenerated)\n    by DeviceName, DeviceId, RemoteIP, InitiatingProcessFileName,\n       InitiatingProcessFolderPath, InitiatingProcessCommandLine\n| where ConnectionCount >= min_connections\n| extend JitterRatio = round(StdDevInterval / AvgInterval, 3)\n| where JitterRatio < max_jitter_ratio    // low jitter = machine-timed = beacon\n| extend GeoInfo = geo_info_from_ip_address(RemoteIP)\n| extend Country = tostring(GeoInfo.country)\n| project DeviceName, DeviceId, RemoteIP, Country, InitiatingProcessFileName,\n          InitiatingProcessFolderPath, InitiatingProcessCommandLine,\n          ConnectionCount, AvgInterval, StdDevInterval, JitterRatio,\n          Ports, Urls, FirstSeen, LastSeen\n| order by JitterRatio asc, ConnectionCount desc\n// TUNING: telemetry agents beacon perfectly too. Build an allow-list keyed on\n//         InitiatingProcessFolderPath, and keep RemoteIP out of it so a hijacked\n//         agent still surfaces."}],"T1573":[{"id":"CA-038","name":"Beaconing - regular-interval outbound connections","url":"","status":"Draft","sev":"High","note":"","kql":"let lookback = 24h;\nlet min_connections = 30;\nlet max_jitter_ratio = 0.15;\nDeviceNetworkEvents\n| where TimeGenerated > ago(lo const KEY = 'attack-coverage-board-v3';
const OLDKEY = 'attack-coverage-board-v2';
const WHOKEY = 'attack-coverage-editor';
const uid = () => 'c' + Math.random().toString(36).slice(2, 9);
const stamp = () => new Date().toISOString();

function fresh(){
  const id = uid();
  return {v: 3, active: id, updated: stamp(), updatedBy: '',
          customers: [{id, name: 'Baseline pack'}], data: {[id]: structuredClone(SEED)}};
}
function sane(o){
  return o && typeof o === 'object' && Array.isArray(o.customers) && o.customers.length && o.data;
}
function readLocal(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const o = JSON.parse(raw); if(sane(o)) return o; }
    const old = localStorage.getItem(OLDKEY);
    if(old){
      const flat = JSON.parse(old);
      if(flat && typeof flat === 'object' && !Array.isArray(flat)){
        const f = fresh(); f.data[f.active] = flat; return f;
      }
    }
  }catch(e){}
  return null;
}

let S = fresh();
let editor = '';
try{ editor = localStorage.getItem(WHOKEY) || ''; }catch(e){}

const bag = () => (S.data[S.active] = S.data[S.active] || {});
const activeName = () => (S.customers.find(c => c.id === S.active) || {name: '—'}).name;
const list = id => bag()[id] || [];
const wls = a => Array.isArray(a.watchlists) ? a.watchlists : [];

function save(){
  S.updated = stamp();
  S.updatedBy = editor;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('Browser storage is unavailable — use Save to keep your work'); }
  queueShared();
}

/* ---------- serialising ---------- */
const asJson = () => JSON.stringify(S, null, 2);
const parseShared = text => JSON.parse(String(text).trim());

/* ---------- merge ---------- */
const keyOf = a => (a.id && a.id.trim() ? 'r:' + a.id.trim().toLowerCase() : 'n:' + (a.name || '').trim().toLowerCase());
function merge(base, inc){
  const out = structuredClone(base);
  const byName = {};
  out.customers.forEach(c => byName[c.name.toLowerCase()] = c.id);
  (inc.customers || []).forEach(c => {
    let tid = byName[c.name.toLowerCase()];
    if(!tid){ tid = uid(); out.customers.push({id: tid, name: c.name}); out.data[tid] = {}; }
    const src = inc.data[c.id] || {}, dst = out.data[tid] = out.data[tid] || {};
    Object.entries(src).forEach(([tech, arr]) => {
      dst[tech] = dst[tech] || [];
      const seen = new Set(dst[tech].map(keyOf));
      arr.forEach(a => { if(!seen.has(keyOf(a))){ dst[tech].push(a); seen.add(keyOf(a)); } });
    });
  });
  return out;
}

/* ---------- shared file handle (File System Access API) ---------- */
const FS_OK = 'showOpenFilePicker' in window;
let handle = null, roSource = null, sharedBusy = false, pending = null, timer = null;

function idb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('attack-board-fs', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('h');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function putHandle(h){
  try{ const db = await idb(); db.transaction('h', 'readwrite').objectStore('h').put(h, 'board'); }catch(e){}
}
async function getHandle(){
  try{
    const db = await idb();
    return await new Promise(res => {
      const q = db.transaction('h', 'readonly').objectStore('h').get('board');
      q.onsuccess = () => res(q.result || null); q.onerror = () => res(null);
    });
  }catch(e){ return null; }
}
async function clearHandle(){
  try{ const db = await idb(); db.transaction('h', 'readwrite').objectStore('h').delete('board'); }catch(e){}
}

let importedName = null;   // mirrors S.importedFrom, set by markImported()

function setLink(state, label){
  const box = document.getElementById('linkBox');
  const txt = document.getElementById('linkTxt');
  box.classList.toggle('on', state === 'rw');
  box.classList.toggle('ro', state === 'ro');
  box.classList.toggle('loaded', !!importedName);
  if(importedName){
    txt.innerHTML = 'Imported \u00b7 <span class="fname">' + esc(importedName) + '</span>';
    box.title = label;                       // live connection state on hover
  }else{
    txt.textContent = label;
    box.removeAttribute('title');
  }
  document.getElementById('linkBtn').textContent = state === 'rw' ? 'Disconnect' : 'Connect file';
  document.getElementById('pullBtn').hidden = state === 'none';
}

/* Records the uploaded file on the pill and flashes it so the change is seen. */
function markImported(name){
  importedName = name || 'imported file';
  S.importedFrom = importedName;             // travels with the board and survives reload
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  setLink(handle ? 'rw' : (roSource ? 'ro' : 'none'),
          handle ? 'Shared file \u00b7 ' + handle.name
                 : (roSource ? 'Shared file \u00b7 read-only' : 'Local only'));
  const box = document.getElementById('linkBox');
  box.classList.remove('flash');
  void box.offsetWidth;                      // restart the animation
  box.classList.add('flash');
  setTimeout(() => box.classList.remove('flash'), 2000);
}

function queueShared(){
  if(!handle) return;
  clearTimeout(timer);
  setLink('rw', 'Saving…');
  timer = setTimeout(writeShared, 1200);
}

async function writeShared(){
  if(!handle || sharedBusy) { if(handle) pending = true; return false; }
  sharedBusy = true;
  let ok = false;
  try{
    if(await handle.queryPermission({mode: 'readwrite'}) !== 'granted'){
      if(await handle.requestPermission({mode: 'readwrite'}) !== 'granted'){
        setLink('ro', 'Permission needed'); sharedBusy = false; return false;
      }
    }
    const w = await handle.createWritable();
    await w.write(asJson());
    await w.close();
    setLink('rw', 'Shared file · saved ' + new Date().toTimeString().slice(0, 5));
    ok = true;
  }catch(e){
    setLink('ro', 'Save failed');
    toast('Could not write the shared file — it may be open elsewhere');
  }
  sharedBusy = false;
  if(pending){ pending = false; queueShared(); }
  return ok;
}

/* Explicit "Save to file". Flushes any debounced write and reports the result.
   With no file connected it runs the picker first, so one click is enough. */
async function saveNow(){
  clearTimeout(timer);
  if(!handle){
    if(!FS_OK){
      toast('This browser cannot write files directly — use Save to download the file instead');
      return;
    }
    await connectFile();                      // picker, then first write
    if(!handle) return;                       // cancelled
  }
  setLink('rw', 'Saving…');
  const ok = await writeShared();
  if(ok) toast('Saved to ' + handle.name);
}

async function connectFile(){
  if(handle){
    handle = null; await clearHandle(); importedName = null; delete S.importedFrom; save();
    setLink(roSource ? 'ro' : 'none', roSource ? 'Shared file · read-only' : 'Local only');
    toast('Disconnected — edits now stay on this device');
    return;
  }
  if(!FS_OK){ toast('This browser cannot write files directly. Use Chrome or Edge, or use Save and replace the file yourself.'); return; }
  try{
    const [h] = await window.showOpenFilePicker({
      types: [{description: 'Board data (JSON)', accept: {'application/json': ['.json']}}],
      multiple: false});
    handle = h; await putHandle(h); importedName = null; delete S.importedFrom;
    askWho();
    const text = await (await h.getFile()).text();
    let inc = null;
    try{ inc = parseShared(text); }catch(e){}
    if(sane(inc)) await reconcile(inc, 'the file you just connected');
    else { await writeShared(); toast('Connected — this board is now written to ' + h.name); }
    setLink('rw', 'Shared file · ' + h.name);
  }catch(e){ /* user cancelled */ }
}

async function pullShared(){
  if(handle){
    try{
      const inc = parseShared(await (await handle.getFile()).text());
      if(sane(inc)) return reconcile(inc, 'the shared file');
    }catch(e){ toast('Could not read the shared file'); }
    return;
  }
  if(roSource) reconcile(roSource, 'the shared file');
}

function askWho(){
  if(editor) return;
  const n = prompt('Your name or initials — recorded in the shared file so the team can see who saved last', '');
  if(n && n.trim()){ editor = n.trim(); try{ localStorage.setItem(WHOKEY, editor); }catch(e){} }
}

/* ---------- reconcile shared vs local ---------- */
function reconcile(inc, label){
  return new Promise(res => {
    const mine = S.updated || '', theirs = inc.updated || '';
    const localEmpty = !localStorage.getItem(KEY);
    if(localEmpty || theirs >= mine){ adopt(inc); res(); return; }
    // local is newer — let the person decide
    const m = document.getElementById('modal');
    document.getElementById('modalTitle').textContent = 'This device has newer changes';
    document.getElementById('mList').className = 'mlist conflict';
    document.getElementById('mList').innerHTML =
      `<div class="mnote">Your browser holds edits saved ${fmt(mine)}${S.updatedBy ? ' by ' + esc(S.updatedBy) : ''}.<br>
       ${esc(label[0].toUpperCase() + label.slice(1))} was saved ${fmt(theirs)}${inc.updatedBy ? ' by ' + esc(inc.updatedBy) : ''}.</div>
       <div class="mbtns">
         <button class="submit" data-m>Merge both</button>
         <button class="ghost" data-t>Use the file</button>
         <button class="ghost" data-k>Keep mine</button>
       </div>`;
    document.getElementById('addCust').hidden = true;
    const done = fn => { fn(); restoreMgr(); shutMgr(); res(); };
    m.querySelector('[data-m]').onclick = () => done(() => { adopt(merge(S, inc)); toast('Merged'); });
    m.querySelector('[data-t]').onclick = () => done(() => { adopt(inc); toast('Loaded the shared file'); });
    m.querySelector('[data-k]').onclick = () => done(() => { save(); toast('Kept this device\'s version'); });
    m.classList.add('on'); document.getElementById('scrim2').classList.add('on');
  });
}
function restoreMgr(){
  document.getElementById('modalTitle').textContent = 'Customer views';
  document.getElementById('mList').className = 'mlist';
  document.getElementById('addCust').hidden = false;
}
function adopt(o){
  S = o;
  importedName = S.importedFrom || importedName;
  if(!S.data[S.active]) S.active = S.customers[0].id;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  fillSelect(); render();
}
const fmt = t => t ? new Date(t).toLocaleString(undefined, {dateStyle: 'medium', timeStyle: 'short'}) : 'at an unknown time';
const stateOf = id => { const a = list(id); if(!a.length) return 'gap'; return a.some(x => x.url && x.url.trim()) ? 'covered' : 'nolink'; };
const linked = id => list(id).filter(x => x.url && x.url.trim()).length;

const allTechs = [];
TACTICS.forEach(c => c.t.forEach(t => { allTechs.push(t); t.s.forEach(s => allTechs.push(s)); }));
const uniq = [...new Set(allTechs.map(t => t.id))];
document.getElementById('techTotal').textContent = uniq.length;

let filter = 'all', query = '';

function matches(t){
  if(query){
    const hay = (t.id + ' ' + t.n + ' ' +
      list(t.id).map(a => a.id + ' ' + a.name + ' ' + wls(a).join(' ')).join(' ')).toLowerCase();
    if(!hay.includes(query)) return false;
  }
  if(filter === 'all') return true;
  const s = stateOf(t.id);
  return filter === 'gap' ? s === 'gap' : filter === 'covered' ? s === 'covered' : s === 'nolink';
}

function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  let shown = 0;

  TACTICS.forEach(col => {
    const el = document.createElement('section');
    el.className = 'tcol';

    const ids = [];
    col.t.forEach(t => { ids.push(t.id); t.s.forEach(s => ids.push(s.id)); });
    const cov = ids.filter(i => stateOf(i) === 'covered').length;
    const par = ids.filter(i => stateOf(i) === 'nolink').length;

    const head = document.createElement('div');
    head.className = 'chead';
    head.innerHTML = `<h2>${col.name}</h2><div class="tid mono">${col.tid}</div>
      <div class="meter"><i class="f" style="width:${cov/ids.length*100}%"></i><i class="p" style="width:${par/ids.length*100}%"></i></div>
      <div class="cmeta"><span>${cov + par} of ${ids.length} mapped</span><span class="mono">${Math.round((cov+par)/ids.length*100)}%</span></div>`;
    el.appendChild(head);

    let any = 0;
    col.t.forEach(t => {
      const subHits = t.s.filter(matches);
      const selfHit = matches(t);
      if(!selfHit && !subHits.length) return;
      any++; shown++;

      const tile = document.createElement('div');
      tile.className = 'tile ' + stateOf(t.id);
      const n = list(t.id).length;
      const badge = n ? `<span class="count ${linked(t.id) ? '' : 'nolink'}">${n}</span>` : '';
      const caret = t.s.length ? `<span class="caret" data-caret title="Show ${t.s.length} sub-techniques">&#9662;${t.s.length}</span>` : '';

      const row = document.createElement('button');
      row.className = 'row';
      row.innerHTML = `<div class="body"><span class="tc mono">${t.id}</span><span class="tn">${t.n}</span></div>${badge}${caret}`;
      row.onclick = e => {
        if(e.target.dataset.caret !== undefined){ tile.classList.toggle('open'); return; }
        open(t, col);
      };
      tile.appendChild(row);

      if(t.s.length){
        const wrap = document.createElement('div');
        wrap.className = 'subs';
        (query || filter !== 'all' ? subHits : t.s).forEach(s => {
          const sn = list(s.id).length;
          const b = document.createElement('button');
          b.className = 'sub ' + stateOf(s.id);
          b.innerHTML = `<div class="body"><span class="tc mono">${s.id}</span><span class="tn">${s.n}</span></div>${sn ? `<span class="count ${linked(s.id) ? '' : 'nolink'}">${sn}</span>` : ''}`;
          b.onclick = () => open(s, col, t);
          wrap.appendChild(b);
        });
        tile.appendChild(wrap);
        if(subHits.length && (query || filter !== 'all')) tile.classList.add('open');
      }
      el.appendChild(tile);
    });

    if(!any) el.insertAdjacentHTML('beforeend', '<div class="empty">Nothing matches here.</div>');
    grid.appendChild(el);
  });

  const cov = uniq.filter(i => stateOf(i) === 'covered').length;
  const par = uniq.filter(i => stateOf(i) === 'nolink').length;
  document.getElementById('gLive').textContent = cov;
  document.getElementById('gPart').textContent = par;
  document.getElementById('gGap').textContent = uniq.length - cov - par;
  document.getElementById('gPct').textContent = Math.round((cov + par) / uniq.length * 100) + '%';
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const KW = /\b(let|where|summarize|project|project-away|project-rename|extend|join|union|order|sort|by|on|kind|take|limit|top|distinct|count|countif|dcount|make_set|make_list|mv-expand|parse|render|arg_max|arg_min|prev|next|stdev|avg|min|max|sum|round|strcat|strlen|split|substring|extract|extract_all|array_length|coalesce|iff|case|bin|ago|now|between|and|or|not|in|has|has_any|has_all|hasprefix|contains|startswith|endswith|matches|regex|isnotempty|isempty|isnull|isnotnull|tostring|toint|tolong|todouble|todynamic|todatetime|parse_json|dynamic|datetime_diff|format_datetime|geo_info_from_ip_address|ipv4_is_private|leftouter|leftanti|rightouter|fullouter|inner|innerunique|isfuzzy|asc|desc|true|false|materialize|toscalar|trim|replace_string|set_difference|array_index_of)\b/;
const RX = new RegExp(
  '(\\/\\/[^\\n]*)' +                                   // comment
  '|(@?"(?:[^"\\\\]|\\\\.)*"|@?\'(?:[^\'\\\\]|\\\\.)*\')' + // string
  '|(\\|)' +                                             // pipe
  '|(\\b\\d+(?:\\.\\d+)?[dhms]?\\b)' +                     // number / timespan
  '|' + KW.source, 'g');

function highlight(src){
  let out = '', last = 0, m;
  RX.lastIndex = 0;
  while((m = RX.exec(src)) !== null){
    out += esc(src.slice(last, m.index));
    const cls = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'p' : m[4] ? 'n' : 'k';
    out += '<span class="' + cls + '">' + esc(m[0]) + '</span>';
    last = m.index + m[0].length;
  }
  return out + esc(src.slice(last));
}

function toast(m){

  el.textContent = m; el.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 2200);
}

  if(!n) return;
  const id = uid();
  S.customers.push({id, name: n});
  S.data[id] = {};
  save(); f.reset(); fillSelect(); paintCustomers(); toast('Added ' + n);
};

/* ---------- controls ---------- */
document.getElementById('q').oninput = e => { query = e.target.value.trim().toLowerCase(); render(); };
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  filter = b.dataset.f; render();
});
document.getElementById('expandAll').onclick = e => {
  const tiles = document.querySelectorAll('.tile');
  const anyShut = [...tiles].some(t => t.querySelector('.subs') && !t.classList.contains('open'));
  tiles.forEach(t => t.classList.toggle('open', anyShut));
  e.target.textContent = anyShut ? 'Collapse sub-techniques' : 'Expand sub-techniques';
};
document.getElementById('close').onclick = shut;
document.getElementById('scrim').onclick = shut;
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ shut(); shutMgr(); } });

document.getElementById('linkBtn').onclick = connectFile;
document.getElementById('saveNowBtn').onclick = saveNow;
document.addEventListener('keydown', e => {          // Ctrl/Cmd+S saves to the file
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); saveNow(); }
});
document.getElementById('pullBtn').onclick = pullShared;
document.getElementById('exp').onclick = () => {
  askWho(); save();
  dl(new Blob([asJson()], {type: 'application/json'}), 'board.json');
  toast('Exported all ' + S.customers.length + ' customer view(s)');
};
document.getElementById('imp').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try{
      const d = parseShared(r.result);
      if(typeof d !== 'object' || Array.isArray(d)) throw 0;
      if(sane(d)){
        await reconcile(d, 'the file you imported');
        markImported(f.name);
        toast('Loaded ' + f.name);
      }else{
        const id = uid(), nm = (f.name || 'Imported').replace(/\.json$/i, '');
        S.customers.push({id, name: nm});
        S.data[id] = d; S.active = id;
        save(); fillSelect(); render();
        markImported(f.name);
        toast('Imported as a new view: ' + nm);
      }
    }catch(err){ toast('That file is not a coverage export — nothing changed'); }
  };
  r.readAsText(f); e.target.value = '';
};
document.getElementById('csv').onclick = () => {
  const rows = [['Customer','Tactic','TacticID','TechniqueID','Technique','Reference','Analytic','Status','Severity','OneNoteURL','Watchlists','Notes','KQL']];
  TACTICS.forEach(c => {
    const walk = (t, pn) => list(t.id).forEach(a =>
      rows.push([activeName(), c.name, c.tid, t.id, pn ? pn + ': ' + t.n : t.n, a.id, a.name, a.status, a.sev, a.url, wls(a).join('; '), a.note, a.kql || '']));
    c.t.forEach(t => { walk(t); t.s.forEach(s => walk(s, t.n)); });
  });
  const csv = rows.map(r => r.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(',')).join('\n');
  dl(new Blob(['\ufeff' + csv], {type: 'text/csv'}), 'attack-coverage-' + slug(activeName()) + '.csv');
  toast('Exported ' + (rows.length - 1) + ' rows');
};
document.getElementById('kqlout').onclick = () => {
  const out = [];
  let n = 0;
  TACTICS.forEach(c => {
    const walk = (t, pn) => list(t.id).forEach(a => {
      if(!a.kql || !a.kql.trim()) return;
      n++;
      out.push('// ' + '='.repeat(76));
      out.push('// ' + (a.id ? '[' + a.id + '] ' : '') + a.name);
      out.push('// Tactic:    ' + c.name + ' (' + c.tid + ')');
      out.push('// Technique: ' + t.id + ' - ' + (pn ? pn + ': ' : '') + t.n);
      out.push('// Status:    ' + a.status + '   Severity: ' + a.sev);
      if(a.url && a.url.trim()) out.push('// OneNote:   ' + a.url);
      if(wls(a).length) out.push('// Watchlists: ' + wls(a).join(', '));
      if(a.note && a.note.trim()) out.push('// Notes:     ' + a.note.replace(/\n/g, '\n//            '));
      out.push('// ' + '='.repeat(76));
      out.push(a.kql.trim(), '', '');
    });
    c.t.forEach(t => { walk(t); t.s.forEach(s => walk(s, t.n)); });
  });
  if(!n){ toast('No stored queries to export yet'); return; }
  const head = ['// Sentinel analytic pack — ' + activeName(),
                '// ' + new Date().toISOString().slice(0, 16).replace('T', ' ') + '   ' + n + ' queries', '', ''].join('\n');
  dl(new Blob([head + out.join('\n')], {type: 'text/plain'}), 'sentinel-analytics-' + slug(activeName()) + '.kql');
  toast('Exported ' + n + ' queries');
};
document.getElementById('wipe').onclick = () => {
  if(!confirm('Remove every analytic from the "' + activeName() + '" view? Other customers are untouched. Save a copy first if you want one.')) return;
  S.data[S.active] = {}; save(); render(); shut(); toast(activeName() + ' cleared');
};
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'view';
function dl(blob, name){
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = name; a.click(); URL.revokeObjectURL(u);
}

/* ---------- boot ---------- */
async function loadSharedSource(){
  try{
    const r = await fetch('board.json', {cache: 'no-store'});
    if(r.ok){ const o = parseShared(await r.text()); if(sane(o)) return o; }
  }catch(e){}
  return null;
}

async function boot(){
  const local = readLocal();
  if(local) S = local;
  importedName = S.importedFrom || null;
  fillSelect(); render();

  const h = await getHandle();
  if(h){
    try{
      if(await h.queryPermission({mode: 'readwrite'}) === 'granted'){
        handle = h;
        setLink('rw', 'Shared file \u00b7 ' + h.name);
        const inc = parseShared(await (await h.getFile()).text());
        if(sane(inc)) await reconcile(inc, 'the shared file');
        return;
      }
      setLink('ro', 'Click Connect to resume ' + h.name);
      return;
    }catch(e){}
  }

  const shared = await loadSharedSource();
  if(shared){
    roSource = shared;
    setLink('ro', 'Shared file \u00b7 read-only');
    await reconcile(shared, 'the shared file');
  }else{
    setLink('none', 'Local only');
    if(!local) save();
  }
}
boot();
</script>
